<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HQL • Kho dữ liệu</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    overflow-x: hidden;
  }

  /* ==== BACKGROUND ĐỘNG ==== */
  body {
    background: #05060d;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(88,101,242,0.25), transparent 40%),
      radial-gradient(circle at 80% 30%, rgba(254,44,85,0.20), transparent 45%),
      radial-gradient(circle at 50% 80%, rgba(255,184,0,0.18), transparent 50%),
      radial-gradient(circle at 10% 90%, rgba(24,119,242,0.20), transparent 45%);
    z-index: -2;
    animation: bgMove 20s ease-in-out infinite alternate;
  }
  @keyframes bgMove {
    0%   { transform: scale(1) rotate(0deg); }
    100% { transform: scale(1.15) rotate(8deg); }
  }

  /* Hạt bay lơ lửng */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(2px 2px at 60% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,0.5), transparent),
      radial-gradient(2px 2px at 10% 60%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.6), transparent);
    z-index: -1;
    animation: starsFloat 15s linear infinite;
    opacity: 0.7;
  }
  @keyframes starsFloat {
    0%   { transform: translateY(0); }
    100% { transform: translateY(-30px); }
  }

  /* ==== CONTAINER ==== */
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 60px 20px 80px;
    position: relative;
    z-index: 1;
  }

  /* ==== HEADER ==== */
  .header { text-align: center; margin-bottom: 50px; }

  .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5865F2, #FE2C55, #FFB800);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    margin: 0 auto 20px;
    box-shadow: 0 0 40px rgba(88,101,242,0.6), 0 0 80px rgba(254,44,85,0.3);
    animation: avatarPulse 3s ease-in-out infinite;
    border: 3px solid rgba(255,255,255,0.15);
  }
  @keyframes avatarPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(88,101,242,0.6), 0 0 80px rgba(254,44,85,0.3); }
    50%      { transform: scale(1.05); box-shadow: 0 0 60px rgba(88,101,242,0.9), 0 0 100px rgba(254,44,85,0.5); }
  }

  h1 {
    font-size: 32px;
    font-weight: 800;
    background: linear-gradient(90deg, #4da3ff, #FE2C55, #FFB800, #4da3ff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShine 4s linear infinite;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }
  @keyframes textShine {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .subtitle {
    color: #8a8aa0;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ==== CARD LƠ LỬNG ==== */
  .cards {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .card {
    position: relative;
    background: rgba(30, 30, 46, 0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 22px 24px;
    text-decoration: none;
    color: inherit;
    display: block;
    overflow: hidden;
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s;
    box-shadow:
      0 10px 30px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.06);
    animation: floatCard 6s ease-in-out infinite;
    animation-delay: var(--delay, 0s);
  }

  @keyframes floatCard {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-10px); }
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 5px; height: 100%;
    background: var(--accent, #4da3ff);
    box-shadow: 0 0 20px var(--accent, #4da3ff);
  }

  .card::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, var(--accent, #4da3ff) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
    z-index: -1;
  }

  .card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow:
      0 20px 50px rgba(0,0,0,0.5),
      0 0 40px var(--accent, #4da3ff),
      inset 0 1px 0 rgba(255,255,255,0.1);
    border-color: var(--accent, #4da3ff);
    animation-play-state: paused;
  }

  .card:hover::after { opacity: 0.12; }

  .card-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .card-icon {
    font-size: 28px;
    filter: drop-shadow(0 0 10px var(--accent, #4da3ff));
  }

  .card-title {
    font-size: 19px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .card-info {
    color: #a0a0b8;
    font-size: 14px;
    margin-left: 42px;
    word-break: break-all;
    line-height: 1.5;
  }

  .card-arrow {
    position: absolute;
    right: 22px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 22px;
    color: var(--accent, #4da3ff);
    opacity: 0.6;
    transition: all 0.3s;
  }

  .card:hover .card-arrow {
    opacity: 1;
    transform: translateY(-50%) translateX(5px);
  }

  /* Accent màu từng card */
  .card.zyo      { --accent: #FFB800; animation-delay: 0s;   }
  .card.discord  { --accent: #5865F2; animation-delay: 0.8s; }
  .card.facebook { --accent: #1877F2; animation-delay: 1.6s; }
  .card.tiktok   { --accent: #FE2C55; animation-delay: 2.4s; }
  .card.github   { --accent: #c0c0c0; animation-delay: 3.2s; }

  /* Badge */
  .badge {
    position: absolute;
    top: 12px; right: 14px;
    background: rgba(255,184,0,0.15);
    color: #FFB800;
    border: 1px solid rgba(255,184,0,0.4);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* ==== FOOTER ==== */
  .footer {
    text-align: center;
    color: #4a4a60;
    margin-top: 60px;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .footer span { color: #FE2C55; }

  /* ==== RESPONSIVE ==== */
  @media (max-width: 520px) {
    h1 { font-size: 24px; }
    .avatar { width: 80px; height: 80px; font-size: 34px; }
    .card { padding: 18px 18px; }
    .card-info { margin-left: 0; margin-top: 6px; }
  }
</style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="avatar">👨‍💻</div>
      <h1>HQL • Kho Dữ Liệu</h1>
      <p class="subtitle">All my links in one place</p>
    </header>

    <div class="cards">

      <a class="card zyo" href="https://zyo.lol/hql_2311" target="_blank" rel="noopener">
        <span class="badge">Thông tin đầy đủ</span>
        <div class="card-head">
          <span class="card-icon">⭐</span>
          <span class="card-title">Zyo.lol</span>
        </div>
        <div class="card-info">https://zyo.lol/hql_2311</div>
        <span class="card-arrow">→</span>
      </a>

      <a class="card discord" href="#" onclick="copyDiscord(event)">
        <div class="card-head">
          <span class="card-icon">💬</span>
          <span class="card-title">Discord</span>
        </div>
        <div class="card-info">ID: hql.2311 — bấm để copy</div>
        <span class="card-arrow">📋</span>
      </a>

      <a class="card facebook" href="https://www.facebook.com/quang.long.502916" target="_blank" rel="noopener">
        <div class="card-head">
          <span class="card-icon">📘</span>
          <span class="card-title">Facebook</span>
        </div>
        <div class="card-info">facebook.com/quang.long.502916</div>
        <span class="card-arrow">→</span>
      </a>

      <a class="card tiktok" href="https://www.tiktok.com/@hql_2311_shop_it" target="_blank" rel="noopener">
        <div class="card-head">
          <span class="card-icon">🎵</span>
          <span class="card-title">TikTok</span>
        </div>
        <div class="card-info">@hql_2311_shop_it</div>
        <span class="card-arrow">→</span>
      </a>

      <a class="card github" href="https://github.com/i-love-IT-tiktok" target="_blank" rel="noopener">
        <div class="card-head">
          <span class="card-icon">💻</span>
          <span class="card-title">GitHub</span>
        </div>
        <div class="card-info">github.com/i-love-IT-tiktok</div>
        <span class="card-arrow">→</span>
      </a>

    </div>

    <p class="footer">© 2026 HQL • Made with <span>❤</span></p>
  </div>

  <script>
    function copyDiscord(e) {
      e.preventDefault();
      navigator.clipboard.writeText("hql.2311").then(() => {
        const el = e.currentTarget.querySelector('.card-info');
        const old = el.textContent;
        el.textContent = "✅ Đã copy: hql.2311";
        el.style.color = "#5865F2";
        setTimeout(() => {
          el.textContent = old;
          el.style.color = "";
        }, 1500);
      });
    }
  </script>
</body>
</html>
