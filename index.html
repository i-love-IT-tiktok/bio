<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kho dữ liệu của HQL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 100%);
    color: #eee;
    min-height: 100vh;
    padding: 30px 20px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { color: #4da3ff; text-align: center; font-size: 28px; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #888; font-size: 14px; margin-bottom: 30px; }
  .card {
    background: #1e1e2e;
    padding: 20px;
    margin: 15px 0;
    border-radius: 12px;
    border-left: 4px solid #4da3ff;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .card:hover { transform: translateX(5px); box-shadow: 0 6px 20px rgba(77,163,255,0.2); }
  .card h3 { color: #fff; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card p { color: #aaa; font-size: 14px; margin-bottom: 10px; word-break: break-all; }
  .card a { color: #4da3ff; text-decoration: none; font-weight: 600; font-size: 14px; }
  .card a:hover { text-decoration: underline; }
  .card.zyo      { border-left-color: #FFB800; }
  .card.zyo a    { color: #FFB800; }
  .card.discord  { border-left-color: #5865F2; }
  .card.discord a { color: #5865F2; }
  .card.facebook { border-left-color: #1877F2; }
  .card.facebook a { color: #1877F2; }
  .card.tiktok   { border-left-color: #FE2C55; }
  .card.tiktok a { color: #FE2C55; }
  .card.github   { border-left-color: #a0a0a0; }
  .card.github a { color: #a0a0a0; }

  #content { margin-top: 20px; }
  .detail-box {
    background: #1e1e2e;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid #333;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .detail-box h2 { color: #4da3ff; margin-bottom: 15px; }
  .detail-box .info {
    background: #252535;
    padding: 12px;
    border-radius: 8px;
    margin: 15px 0;
    word-break: break-all;
    font-family: monospace;
    font-size: 13px;
    color: #7ec8ff;
    border: 1px dashed #444;
  }
  .detail-box ul { list-style: none; padding: 0; }
  .detail-box ul li {
    padding: 10px 12px;
    background: #252535;
    margin: 8px 0;
    border-radius: 8px;
    border-left: 3px solid #4da3ff;
    font-size: 14px;
  }
  .detail-box ul li a { color: #7ec8ff; text-decoration: none; word-break: break-all; }
  .detail-box ul li a:hover { text-decoration: underline; }
  .btn-copy {
    background: #4da3ff;
    color: #fff;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    margin: 5px 5px 5px 0;
    font-weight: 600;
  }
  .btn-copy:hover { background: #3a8fe0; }
  .back {
    display: inline-block;
    color: #888;
    text-decoration: none;
    margin-top: 20px;
    font-size: 14px;
  }
  .back:hover { color: #4da3ff; }
  .badge {
    background: #2a2a3e;
    color: #888;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    margin-left: auto;
  }
  .note {
    background: #2a2410;
    color: #FFB800;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin: 10px 0;
    border-left: 3px solid #FFB800;
  }
  .footer { text-align: center; color: #555; margin-top: 40px; font-size: 12px; }
</style>
</head>
<body>
  <div class="container">
    <h1>📁 Kho dữ liệu của HQL</h1>
    <p class="subtitle">Chọn mục bên dưới để xem chi tiết và link riêng</p>
    <div id="content"></div>
    <p class="footer">© 2026 HQL • Made with ❤️</p>
  </div>

<script>
const data = {
  zyo: {
    title: "⭐ Zyo.lol",
    note: "Thông tin đầy đủ",
    info: "Trang tổng hợp — click để mở nhoa <3",
    raw: "https://zyo.lol/hql_2311",
    list: [
      { name: "Link Zyo", value: "https://zyo.lol/hql_2311" },
      { name: "Ghi chú", value: "Thông tin đầy đủ" },
      { name: "Tên hiển thị", value: "hql.2311" },
      { name: "Vị trí", value: "Đắk Mil, Lâm Đồng" },
      { name: "Bio", value: "I Love GitHub • I Love my friend • I Love Python • I Love Html 😊👉👈" },
      { name: "Launcher", value: "SKlauncher 4.0" },
      { name: "Nhạc", value: "Chill cùng tui nhoa" }
    ]
  },
  discord: {
    title: "💬 Discord",
    info: "id discord hql.2311",
    raw: "hql.2311",
    list: [{ name: "Tên người dùng", value: "hql.2311" }]
  },
  facebook: {
    title: "📘 Facebook",
    info: "https://www.facebook.com/quang.long.502916",
    raw: "https://www.facebook.com/quang.long.502916",
    list: [{ name: "Link Facebook", value: "https://www.facebook.com/quang.long.502916" }]
  },
  tiktok: {
    title: "🎵 TikTok",
    info: "https://www.tiktok.com/@hql_2311_shop_it",
    raw: "https://www.tiktok.com/@hql_2311_shop_it",
    list: [{ name: "Link TikTok", value: "https://www.tiktok.com/@hql_2311_shop_it" }]
  },
  github: {
    title: "💻 GitHub",
    info: "https://github.com/i-love-IT-tiktok",
    raw: "https://github.com/i-love-IT-tiktok",
    list: [{ name: "Link GitHub", value: "https://github.com/i-love-IT-tiktok" }]
  }
};

const homeHTML = Object.entries(data).map(([key, d]) => `
  <div class="card ${key}">
    <h3>${d.title} <span class="badge">/${key}</span></h3>
    ${d.note ? `<div class="note">📝 ${d.note}</div>` : ''}
    <p>${d.info}</p>
    <a href="#/${key}">→ Xem chi tiết</a>
  </div>
`).join("");

function render() {
  const hash = location.hash.replace("#/", "") || "";
  const box = document.getElementById("content");
  if (data[hash]) {
    const d = data[hash];
    box.innerHTML = `
      <div class="detail-box">
        <h2>${d.title}</h2>
        ${d.note ? `<div class="note">📝 Ghi chú: ${d.note}</div>` : ''}
        <p style="color:#aaa; font-size:14px; margin-top:10px;">${d.info}</p>
        <div class="info">${d.raw}</div>
        <button class="btn-copy" onclick="copyText('${d.raw}')">📋 Copy</button>
        ${d.raw.startsWith('http') ? `<a href="${d.raw}" target="_blank"><button class="btn-copy" style="background:#2a2a3e;">🔗 Mở link</button></a>` : ''}
        <h4 style="margin-top:20px; color:#4da3ff;">Danh sách dữ liệu:</h4>
        <ul>
          ${d.list.map(item => `
            <li>
              <strong style="color:#ccc;">${item.name}:</strong>
              ${item.value.startsWith('http')
                ? `<a href="${item.value}" target="_blank">${item.value}</a>`
                : item.value}
            </li>
          `).join("")}
        </ul>
        <a href="#/" class="back">← Quay lại trang chủ</a>
      </div>
    `;
  } else {
    box.innerHTML = homeHTML;
  }
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => alert("Đã copy: " + text));
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
